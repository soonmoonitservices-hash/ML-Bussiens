name: iOS TestFlight

# Nur von Hand starten (Actions > iOS TestFlight > Run workflow).
# Baut die App auf einem Mac-Runner, signiert über den App-Store-Connect-API-Schlüssel
# (Apple legt Zertifikat und Profil selbst an) und lädt den Build zu TestFlight hoch.
#
# Nötige Secrets im Repository:
#   APPLE_TEAM_ID        Team-ID (developer.apple.com > Membership)
#   ASC_KEY_ID           Schlüssel-ID des API-Schlüssels
#   ASC_ISSUER_ID        Issuer-ID (App Store Connect > Benutzer > Integrationen)
#   ASC_KEY_P8_BASE64    Inhalt der .p8-Datei als Base64 (base64 -w0 AuthKey_XXXX.p8)
#   PROD_SUPABASE_URL    https://<ref>.supabase.co
#   PROD_SUPABASE_ANON_KEY  öffentlicher (anon/publishable) Schlüssel, nie der Service-Role-Key
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      BUNDLE_ID: de.rasho.warenbestand
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Konfiguration für die App schreiben
        run: |
          cat > config/prod.json <<EOF
          {
            "FLAVOR": "prod",
            "SUPABASE_URL": "${{ secrets.PROD_SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.PROD_SUPABASE_ANON_KEY }}"
          }
          EOF

      - name: API-Schlüssel ablegen
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: iOS bauen (ohne Signatur)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define-from-file=config/prod.json \
            --build-number=${{ github.run_number }}

      - name: Archiv erstellen und signieren
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/Runner.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Automatic \
            archive

      - name: Exportieren und zu TestFlight hochladen
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/Runner.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      - name: API-Schlüssel löschen
        if: always()
        run: rm -rf ~/private_keys
